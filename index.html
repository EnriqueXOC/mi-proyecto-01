<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; line-height: 1.6; max-width: 600px; margin: 20px auto; padding: 0 15px; }
        hr { border: 0; border-top: 1px solid #333; }
        h1 { color: #ffffff; }
    </style>
</head>
<body>
    <h1>Proyecto prueba|1|1|</h1>
    <main>
        <p>Hola, Contenido en tema oscuro.</p>
    </main>
    <hr>
    <h1>Hora del servidor:</h1>
    <h1 id="dato">Cargando...</h1>
    <script>
        fetch('https://mispruebashost.site.je/index.php')
            .then(r => r.text())
            .then(data => document.getElementById('dato').innerText = data)
            .catch(e => document.getElementById('dato').innerText = "Servidor bloqueado.");
    </script>
</body>
</html>
